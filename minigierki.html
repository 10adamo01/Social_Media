<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigierki | Zawlox</title>
    <meta name="description" content="Minigierki Zawloxa: Aim Trainer, Refleks, Pamięć i Wąż. Zaloguj się przez Discord i zawalcz o top 5 w każdej grze.">
    <meta property="og:title" content="Minigierki | Zawlox">
    <meta property="og:description" content="Aim Trainer, Refleks, Pamięć i Wąż – zawalcz o top 5 w każdej grze.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://10adamo01.github.io/Social_Media/podglad.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#0e0e10">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M12 0h52v52L52 64H0V12z' fill='%230e0e10' stroke='%23d4d4d8' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23a970ff' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gry.css">
    <style>
        .hub { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .card { --cut: 20px; display: block; transition: transform 0.25s ease; }
        .card:hover { transform: translateY(-4px); background: var(--silver); }
        .card > .hud-in { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 22px; background: linear-gradient(180deg, #141417 0%, #0f0f12 100%); }
        .art {
            --c: 16px;
            display: grid; place-items: center;
            aspect-ratio: 1;
            background: var(--surface-2);
            box-shadow: inset 0 0 0 1px var(--line);
            clip-path: polygon(var(--c) 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%, 0 var(--c));
        }
        .art svg { width: 64%; height: 64%; }
        .card-tag { margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent-2); }
        .card-name {
            margin: 4px 0 6px;
            font-family: var(--font-display); font-weight: 900; font-size: 36px; line-height: 1; text-transform: uppercase;
        }
        .card-desc { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
        .mini-board { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
        .mini-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px; background: var(--surface-2); font-size: 13px; }
        .mini-row .rank { font-size: 16px; }
        .mini-row:nth-child(1) .rank { color: var(--gold); }
        .mini-row:nth-child(2) .rank { color: var(--silver-medal); }
        .mini-row:nth-child(3) .rank { color: var(--bronze); }
        .mini-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-score { font-family: var(--font-display); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .mini-empty { padding: 8px 10px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--dim); }
        .card-cta { margin-top: 14px; }
        @media (max-width: 860px) { .hub { grid-template-columns: 1fr; } }
        @media (max-width: 480px) {
            .card > .hud-in { grid-template-columns: 1fr; padding: 18px; }
            .art { width: 96px; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
        <symbol id="i-arrow-right" viewBox="0 0 448 512"><path d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"/></symbol>
    </defs></svg>
    <div class="bg-glow" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <main>
        <div class="top">
            <a class="back" href="./"><svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg> Wróć do Zawlox</a>
        </div>

        <div class="title-row">
            <div>
                <p class="kicker">Zagraj i zawalcz o top 5</p>
                <h1>Minigierki</h1>
            </div>
            <p class="rules">Każda gra ma <b>osobny ranking</b>. Zaloguj się raz przez <b>Discord</b> – logowanie działa we wszystkich grach, a w rankingu pojawi się Twój nick i avatar.</p>
        </div>

        <div id="hub" class="hub"></div>
    </main>

    <script src="config.js"></script>
    <script src="gry-lista.js"></script>
    <script>
        // Grafiki do kafelków (proste ikony rysowane w SVG)
        const ART = {
            aim: '<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="22" stroke="#efeff1" stroke-width="4"/><circle cx="32" cy="32" r="12" stroke="#a970ff" stroke-width="4"/><circle cx="32" cy="32" r="4" fill="#efeff1"/><path d="M32 2v12M32 50v12M2 32h12M50 32h12" stroke="#2fd17a" stroke-width="3"/></svg>',
            reflex: '<svg viewBox="0 0 64 64" fill="none"><rect x="8" y="8" width="48" height="48" fill="#1f9d55"/><path d="M36 12 20 36h12l-4 16 16-24H32z" fill="#efeff1"/></svg>',
            memory: '<svg viewBox="0 0 64 64"><rect x="6" y="6" width="24" height="24" fill="#a970ff"/><rect x="34" y="6" width="24" height="24" fill="#2fd17a" opacity=".35"/><rect x="6" y="34" width="24" height="24" fill="#f5c542" opacity=".35"/><rect x="34" y="34" width="24" height="24" fill="#38bdf8"/></svg>',
            snake: '<svg viewBox="0 0 64 64"><rect x="8" y="40" width="10" height="10" fill="#9147ff"/><rect x="18" y="40" width="10" height="10" fill="#a970ff"/><rect x="28" y="40" width="10" height="10" fill="#9147ff"/><rect x="28" y="30" width="10" height="10" fill="#a970ff"/><rect x="28" y="20" width="10" height="10" fill="#efeff1"/><circle cx="50" cy="16" r="6" fill="#f5c542"/></svg>'
        };

        const cfg = window.ZAWLOX_CONFIG || {};
        const LISTA = window.ZAWLOX_GRY || {};
        const nf = new Intl.NumberFormat('pl-PL');
        const hub = document.getElementById('hub');

        function card(id, g) {
            const a = document.createElement('a');
            a.className = 'hud card';
            a.href = g.url;
            a.innerHTML = `
                <div class="hud-in">
                    <div class="art" aria-hidden="true">${ART[id] || ''}</div>
                    <div>
                        <p class="card-tag"></p>
                        <h2 class="card-name"></h2>
                        <p class="card-desc"></p>
                        <ol class="mini-board" aria-label="Top 3"><li class="mini-empty">Wczytuję ranking…</li></ol>
                        <span class="btn btn-primary btn-sm card-cta">Graj <svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg></span>
                    </div>
                </div>`;
            a.querySelector('.card-tag').textContent = g.tag;
            a.querySelector('.card-name').textContent = g.name;
            a.querySelector('.card-desc').textContent = g.desc;
            return a;
        }

        async function loadTop(id, g, list) {
            if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) { list.innerHTML = '<li class="mini-empty">Ranking wkrótce</li>'; return; }
            try {
                const url = `${cfg.supabaseUrl.replace(/\/$/, '')}/rest/v1/leaderboard?select=player_name,score&game=eq.${id}` +
                            `&order=score.${g.lower ? 'asc' : 'desc'},created_at.asc&limit=3`;
                const r = await fetch(url, { headers: { apikey: cfg.supabaseAnonKey, Authorization: `Bearer ${cfg.supabaseAnonKey}` } });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const rows = await r.json();
                if (!rows.length) { list.innerHTML = '<li class="mini-empty">Brak wyników – bądź pierwszy!</li>'; return; }
                list.innerHTML = '';
                rows.forEach((p, i) => {
                    const li = document.createElement('li');
                    li.className = 'mini-row';
                    li.innerHTML = '<span class="rank"></span><span class="mini-name"></span><span class="mini-score"></span>';
                    li.querySelector('.rank').textContent = i + 1;
                    li.querySelector('.mini-name').textContent = p.player_name;
                    li.querySelector('.mini-score').textContent = nf.format(p.score) + (g.unit ? ' ' + g.unit : '');
                    list.appendChild(li);
                });
            } catch (e) {
                list.innerHTML = '<li class="mini-empty">Nie udało się wczytać rankingu</li>';
            }
        }

        for (const [id, g] of Object.entries(LISTA)) {
            const c = card(id, g);
            hub.appendChild(c);
            loadTop(id, g, c.querySelector('.mini-board'));
        }
    </script>
</body>
</html>
